<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface antialiased overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min bg-surface shadow-sm transition-colors duration-200">
<button class="w-[48px] h-[48px] -ml-3 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="text-title-md font-title-md font-bold text-primary">DIY-Nest</h1>
<div class="w-[48px] h-[48px] -mr-3 flex items-center justify-center">
<img class="w-8 h-8 rounded-full object-cover shadow-sm border border-outline-variant" data-alt="A small circular profile picture of a female Indian artisan, featuring a warm, smiling face in soft natural lighting. She is wearing a traditional, subtly patterned scarf. The image reflects a trustworthy and approachable personality, set against a neutral, softly blurred workshop background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD_-6gcMPAbmdn40drt4B3WzAKpqTKDMjKpRzue8NWFkk0SZ-Wib8Uwn-kxrJffh-FAJfMqoxi9Q3CvsXFNtCbUyLHlmK_MbGIs0lzOHH9U8kBduREmiKo5uzynH8FxiVqqFKILbylAfiXBuM2PmTzCtACZ9T3_WXLwcii2-4IWIcg2FY0bX-ljSi8SR2G5kWPNe2ECO4kbBN6zLlm8lsSYufjitsBSfLIDObin9ChKQplxoEZqPn8A"/>
</div>
</header>
<!-- Main Viewfinder Area -->
<main class="flex-1 flex flex-col pt-[48px] relative h-screen bg-black">
<!-- Camera Live View (Placeholder) -->
<div class="flex-1 relative w-full overflow-hidden bg-surface-dim">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A top-down, high-quality photograph of a beautifully handwoven Indian silk dupatta resting flat on a textured wooden artisan workbench. The fabric features rich, warm terracotta and deep indigo patterns woven into the silk. The scene is lit by soft, natural, diffused daylight highlighting the tactile texture of the silk and the wood grain, fitting a warm, modern, and trustworthy aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCTZ9ZdYNYjwvq9BLRKmIA8lrCueU6ss5NaK7NcL4tV4_640CzTmWYawWfXIL62guK6U4_aeNsP7XEHi_XCKkdFsG-Uvz-z5jxlfa6wI8-E_xR433XGR0x6KTEbjRK_uiGbQSYAjI_VKHuDAz206-2hYYSd4fQVwHVL-kFP4xv_pWeHnOMFLjUesGEMNGw8AmVV27wnmQ61K0QrPI4Wd3z2iwGPsmqyHIZPnbctLtiY-23o1zoi5D7c')"></div>
<!-- Soft vignette for better text readability -->
<div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/10 pointer-events-none"></div>
<!-- Instructional Overlay -->
<div class="absolute top-stack-md left-0 right-0 flex justify-center z-10 px-margin-mobile">
<div class="bg-inverse-surface/85 backdrop-blur-md text-inverse-on-surface px-6 py-3 rounded-full flex items-center gap-2 shadow-lg">
<span class="material-symbols-outlined text-[18px]">info</span>
<span class="text-label-lg font-label-lg">Take a clear photo of your product.</span>
</div>
</div>
<!-- Focus Guide (Rule of Thirds / Center Frame) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none p-margin-mobile">
<div class="w-full max-w-sm aspect-square border-[1.5px] border-white/40 rounded-2xl relative">
<!-- Corner markers -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-[3px] border-l-[3px] border-white rounded-tl-2xl"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-[3px] border-r-[3px] border-white rounded-tr-2xl"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-[3px] border-l-[3px] border-white rounded-bl-2xl"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-[3px] border-r-[3px] border-white rounded-br-2xl"></div>
</div>
</div>
</div>
<!-- Bottom Controls Sheet -->
<div class="bg-surface rounded-t-[24px] shadow-[0_-8px_24px_rgba(148,68,46,0.06)] relative z-20 flex flex-col pt-stack-lg pb-margin-mobile px-margin-mobile gap-stack-lg -mt-4">
<!-- Quick Actions & Shutter -->
<div class="flex justify-between items-center px-4">
<!-- Gallery Button -->
<button class="w-[56px] h-[56px] flex flex-col items-center justify-center text-on-surface-variant bg-surface-container rounded-full hover:bg-surface-container-high transition-colors shadow-sm">
<span class="material-symbols-outlined">photo_library</span>
</button>
<!-- Capture (Shutter) Button -->
<button class="w-[88px] h-[88px] rounded-full border-[5px] border-primary p-1 flex items-center justify-center active:scale-95 transition-all duration-150 ease-out shadow-md group">
<div class="w-full h-full rounded-full bg-primary group-hover:bg-primary-container transition-colors shadow-inner flex items-center justify-center">
<span class="material-symbols-outlined filled text-on-primary text-[32px] opacity-0 group-active:opacity-100 transition-opacity">camera</span>
</div>
</button>
<!-- Flash Toggle -->
<button class="w-[56px] h-[56px] flex flex-col items-center justify-center text-on-surface-variant bg-surface-container rounded-full hover:bg-surface-container-high transition-colors shadow-sm">
<span class="material-symbols-outlined">flash_off</span>
</button>
</div>
<!-- Primary Action (Disabled state) -->
<button class="w-full h-[56px] rounded-[16px] bg-surface-variant text-outline text-label-lg font-label-lg flex items-center justify-center opacity-60 cursor-not-allowed transition-colors" disabled="">
                Continue
            </button>
</div>
</main>
