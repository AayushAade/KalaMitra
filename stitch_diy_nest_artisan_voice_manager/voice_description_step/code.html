<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Voice Description - Artisan Hub</title>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-dim": "#dcdad7",
                    "primary": "#762d19",
                    "on-secondary-container": "#52647c",
                    "on-tertiary-container": "#b2d9ff",
                    "surface-bright": "#fcf9f6",
                    "tertiary-container": "#006195",
                    "inverse-on-surface": "#f3f0ed",
                    "on-surface-variant": "#55433e",
                    "secondary-fixed": "#d2e4ff",
                    "surface-container": "#f0edea",
                    "error-container": "#ffdad6",
                    "surface-container-lowest": "#ffffff",
                    "secondary": "#4e6078",
                    "secondary-container": "#cee1fe",
                    "surface-container-low": "#f6f3f0",
                    "outline-variant": "#dbc1bb",
                    "on-error-container": "#93000a",
                    "on-secondary-fixed": "#081c31",
                    "on-surface": "#1b1c1a",
                    "on-primary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "tertiary": "#004871",
                    "outline": "#88726d",
                    "primary-container": "#94442e",
                    "inverse-surface": "#31302f",
                    "on-primary-fixed": "#3b0800",
                    "surface": "#fcf9f6",
                    "on-primary-container": "#ffc8ba",
                    "terracotta-container": "#b35c44",
                    "surface-tint": "#974630",
                    "on-secondary-fixed-variant": "#36485f",
                    "tertiary-fixed": "#cde5ff",
                    "tertiary-fixed-dim": "#94ccff",
                    "primary-fixed-dim": "#ffb5a1",
                    "on-secondary": "#ffffff",
                    "primary-fixed": "#ffdbd1",
                    "secondary-fixed-dim": "#b5c8e4",
                    "on-tertiary-fixed-variant": "#004b74",
                    "error": "#ba1a1a",
                    "error-red": "#ba1a1a",
                    "on-primary-fixed-variant": "#79301b",
                    "on-tertiary-fixed": "#001d32",
                    "voice-blue": "#167bb8",
                    "inverse-primary": "#ffb5a1",
                    "background": "#fcf9f6",
                    "on-background": "#1b1c1a",
                    "indigo-container": "#cee1fe",
                    "on-error": "#ffffff",
                    "surface-cream": "#f0edea",
                    "surface-container-high": "#eae8e5",
                    "surface-container-highest": "#e5e2df",
                    "surface-variant": "#e5e2df"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "20px",
                    "stack-sm": "8px",
                    "margin-desktop": "64px",
                    "stack-md": "16px",
                    "stack-lg": "32px",
                    "touch-target": "48px",
                    "gutter": "16px",
                    "unit": "8px"
            },
            "fontFamily": {
                    "display-lg": ["Be Vietnam Pro"],
                    "headline-lg": ["Be Vietnam Pro"],
                    "voice-assist": ["Be Vietnam Pro"],
                    "title-md": ["Be Vietnam Pro"],
                    "body-lg": ["Be Vietnam Pro"],
                    "body-md": ["Be Vietnam Pro"],
                    "label-lg": ["Be Vietnam Pro"],
                    "headline-lg-mobile": ["Be Vietnam Pro"]
            },
            "fontSize": {
                    "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                    "voice-assist": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                    "title-md": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                    "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                    "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                    "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                    "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }]
            }
          },
        }
      }
    </script>
<style>
        /* Pulse Animation for Voice Indicator */
        @keyframes ripple {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }
        
        .animate-ripple {
            animation: ripple 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        
        .animation-delay-500 {
            animation-delay: 500ms;
        }

        /* Ambient glowing background */
        .ambient-glow {
            background: radial-gradient(circle at 50% 50%, rgba(22, 123, 184, 0.08) 0%, rgba(252, 249, 246, 0) 70%);
        }
    </style>
</head>
<body class="bg-surface-dim flex items-center justify-center min-h-screen font-body-md text-on-surface antialiased selection:bg-tertiary-container selection:text-on-tertiary-container">
<!-- Mobile Device Container -->
<main class="w-full max-w-md h-[100dvh] bg-surface-bright flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[40px] sm:h-[850px] sm:border-8 sm:border-surface-container-lowest">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 pointer-events-none ambient-glow z-0"></div>
<!-- Top Navigation (Transactional) -->
<header class="relative z-10 flex items-center justify-between px-margin-mobile py-stack-md shrink-0">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface-variant active:scale-95">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="font-label-lg text-label-lg text-secondary tracking-widest uppercase">Step 2 of 4</span>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Header Content -->
<section class="relative z-10 px-margin-mobile mt-stack-sm text-center shrink-0">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm">
                Tell us about your product
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                Speak naturally in your preferred language.
            </p>
</section>
<!-- Central Interactive Area -->
<section class="relative z-10 flex-1 flex flex-col items-center justify-center py-stack-lg">
<!-- Language Indicator Pill -->
<div class="bg-indigo-container text-on-secondary-fixed-variant font-label-lg text-label-lg px-5 py-2.5 rounded-full flex items-center gap-2 mb-12 shadow-sm border border-secondary-container/50">
<span class="material-symbols-outlined text-[18px] animate-pulse" data-icon="graphic_eq">graphic_eq</span>
                Listening in Marathi (मराठी)
            </div>
<!-- Prominent Animated Microphone -->
<div class="relative w-48 h-48 flex items-center justify-center my-stack-md">
<!-- Ripple Layers -->
<div class="absolute inset-0 bg-voice-blue rounded-full opacity-20 animate-ripple"></div>
<div class="absolute inset-4 bg-voice-blue rounded-full opacity-30 animate-ripple animation-delay-500"></div>
<!-- Core Button -->
<button class="relative z-10 w-24 h-24 bg-voice-blue text-white rounded-full flex items-center justify-center shadow-[0_8px_30px_rgba(22,123,184,0.3)] transition-transform active:scale-95 group">
<span class="material-symbols-outlined text-[40px] group-active:scale-90 transition-transform" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Timer -->
<div class="mt-8 font-display-lg text-display-lg text-primary tabular-nums tracking-tight">
                00:14
            </div>
</section>
<!-- Bottom Action Dock (Glassmorphism/Card Style) -->
<section class="relative z-20 bg-surface-container-lowest rounded-t-[32px] px-margin-mobile pt-stack-lg pb-[calc(32px+env(safe-area-inset-bottom))] shadow-[0_-8px_30px_rgba(118,45,25,0.06)] border-t border-outline-variant/20 flex flex-col gap-stack-lg shrink-0">
<!-- Secondary Actions Control Row -->
<div class="flex justify-between items-center px-4">
<!-- Play/Review -->
<button class="flex flex-col items-center gap-2 text-secondary hover:text-primary transition-colors group">
<div class="w-14 h-14 rounded-full bg-surface-container-low group-hover:bg-surface-container flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-[24px]" data-icon="play_arrow" data-weight="fill" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<span class="font-label-lg text-[13px] tracking-wide">Play</span>
</button>
<!-- Stop Recording (Prominent Secondary) -->
<button class="flex flex-col items-center gap-2 text-error-red group">
<div class="w-16 h-16 rounded-full bg-error-container text-on-error-container flex items-center justify-center shadow-sm group-active:scale-95 transition-transform border border-error/10">
<span class="material-symbols-outlined text-[28px]" data-icon="stop" data-weight="fill" style="font-variation-settings: 'FILL' 1;">stop</span>
</div>
<span class="font-label-lg text-[13px] tracking-wide font-bold">Stop</span>
</button>
<!-- Record Again -->
<button class="flex flex-col items-center gap-2 text-secondary hover:text-primary transition-colors group">
<div class="w-14 h-14 rounded-full bg-surface-container-low group-hover:bg-surface-container flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-[24px]" data-icon="replay">replay</span>
</div>
<span class="font-label-lg text-[13px] tracking-wide">Redo</span>
</button>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-title-md text-title-md shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-all active:scale-[0.98] hover:bg-primary-container hover:text-on-primary-container disabled:opacity-50 disabled:cursor-not-allowed">
                Continue
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</section>
</main>
</body></html>
