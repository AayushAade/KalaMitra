<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DIY-Nest - Language Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#ffb5a1",
                        "inverse-surface": "#31302f",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f3f0ed",
                        "secondary": "#4e6078",
                        "surface-bright": "#fcf9f6",
                        "primary": "#94442e",
                        "on-tertiary-container": "#fefdff",
                        "on-primary-fixed": "#3b0900",
                        "on-surface-variant": "#55433e",
                        "surface-dim": "#dcdad7",
                        "primary-container": "#b35c44",
                        "surface-container-highest": "#e5e2df",
                        "secondary-container": "#cee1fe",
                        "on-tertiary-fixed": "#001d32",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#fffcff",
                        "on-secondary-fixed-variant": "#36485f",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#b5c8e4",
                        "tertiary": "#006195",
                        "on-secondary-container": "#52647c",
                        "surface-container-low": "#f6f3f0",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#eae8e5",
                        "tertiary-fixed": "#cde5ff",
                        "on-error": "#ffffff",
                        "primary-fixed": "#ffdbd1",
                        "error": "#ba1a1a",
                        "surface": "#fcf9f6",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#79301b",
                        "outline-variant": "#dbc1ba",
                        "surface-variant": "#e5e2df",
                        "surface-tint": "#974730",
                        "primary-fixed-dim": "#ffb5a1",
                        "tertiary-fixed-dim": "#94ccff",
                        "on-background": "#1b1c1a",
                        "tertiary-container": "#167bb8",
                        "secondary-fixed": "#d2e4ff",
                        "outline": "#88726d",
                        "surface-container": "#f0edea",
                        "on-secondary-fixed": "#081c32",
                        "on-surface": "#1b1c1a",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#004b74",
                        "background": "#fcf9f6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "stack-md": "16px",
                        "margin-mobile": "20px",
                        "stack-lg": "32px",
                        "gutter": "16px",
                        "unit": "8px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Be Vietnam Pro"],
                        "label-lg": ["Be Vietnam Pro"],
                        "headline-lg": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"],
                        "voice-assist": ["Be Vietnam Pro"],
                        "title-md": ["Be Vietnam Pro"],
                        "headline-lg-mobile": ["Be Vietnam Pro"],
                        "display-lg": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "voice-assist": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "title-md": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased overflow-x-hidden">
<!-- Top App Bar - Linear Transactional (Suppressed Nav, just branding/back) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min bg-surface dark:bg-inverse-surface shadow-sm transition-colors duration-200">
<button aria-label="Go back" class="flex items-center justify-center w-12 h-12 text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-high dark:hover:bg-surface-container-highest rounded-full transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="text-title-md font-title-md font-bold text-primary dark:text-inverse-primary">
            DIY-Nest
        </div>
<div class="w-12 h-12"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-[calc(48px+32px)] pb-[calc(100px+32px)] md:pb-[calc(80px+32px)] w-full max-w-md mx-auto">
<!-- Header Section -->
<div class="text-center mb-stack-lg w-full">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-primary mb-unit">Choose your language</h1>
<h2 class="text-title-md font-title-md text-on-surface-variant">अपनी भाषा चुनें</h2>
</div>
<!-- Language Selection Cards -->
<div class="w-full flex flex-col gap-stack-md">
<!-- Hindi Card -->
<button class="group w-full bg-surface-container-lowest border-2 border-surface-variant rounded-xl p-stack-md flex items-center justify-between hover:border-outline transition-colors duration-200 shadow-[0_4px_20px_rgba(148,68,46,0.08)]">
<div class="flex items-center gap-stack-md">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary font-bold text-xl">
                        अ
                    </div>
<div class="text-left">
<div class="text-title-md font-title-md text-on-surface">हिंदी</div>
<div class="text-body-md font-body-md text-on-surface-variant">Hindi</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-surface-variant group-hover:border-outline transition-colors"></div>
</button>
<!-- Marathi Card -->
<button class="group w-full bg-surface-container-lowest border-2 border-surface-variant rounded-xl p-stack-md flex items-center justify-between hover:border-outline transition-colors duration-200 shadow-[0_4px_20px_rgba(148,68,46,0.08)]">
<div class="flex items-center gap-stack-md">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary font-bold text-xl">
                        म
                    </div>
<div class="text-left">
<div class="text-title-md font-title-md text-on-surface">मराठी</div>
<div class="text-body-md font-body-md text-on-surface-variant">Marathi</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-surface-variant group-hover:border-outline transition-colors"></div>
</button>
<!-- English Card (Selected) -->
<button class="group w-full bg-surface-bright border-2 border-primary rounded-xl p-stack-md flex items-center justify-between shadow-[0_4px_20px_rgba(148,68,46,0.15)] relative overflow-hidden">
<!-- Subtle indicator background -->
<div class="absolute inset-0 bg-primary opacity-5 pointer-events-none"></div>
<div class="flex items-center gap-stack-md relative z-10">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed font-bold text-xl">
                        E
                    </div>
<div class="text-left">
<div class="text-title-md font-title-md text-primary font-bold">English</div>
<div class="text-body-md font-body-md text-on-surface-variant">English</div>
</div>
</div>
<div class="relative z-10 flex items-center justify-center w-6 h-6 rounded-full bg-primary text-on-primary">
<span class="material-symbols-outlined text-[16px]" data-icon="check" data-weight="fill">check</span>
</div>
</button>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface shadow-[0_-4px_20px_rgba(148,68,46,0.08)] z-40 flex justify-center">
<button class="w-full max-w-md h-[56px] bg-primary text-on-primary rounded-xl text-title-md font-title-md font-bold flex items-center justify-center gap-unit hover:bg-primary-container transition-colors duration-200 shadow-md">
<span>Continue</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</body></html>
